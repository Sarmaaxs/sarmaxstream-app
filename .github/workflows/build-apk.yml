name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
<<<<<<< HEAD
        run: flutter analyze
=======
        run: flutter analyze --no-fatal-infos
>>>>>>> 559808d1ebbae9b95dcf20f0dd4adef721fc732e

      - name: Test
        run: flutter test

      # Optional: add these 4 repository secrets to get an APK signed with YOUR key.
      #   ANDROID_KEYSTORE_BASE64  (base64 of your .jks file)
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them the APK is signed with the debug key (OK for testing only).
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/upload.jks" \
              > android/key.properties
          else
            echo "::warning::No signing secrets set - APK will use the debug key (testing only)."
          fi

      - name: Build release APK (obfuscated)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarmaxstream-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # Needed to read crash stack traces from the obfuscated build. Keep private.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: sarmaxstream-symbols
          path: build/symbols
          if-no-files-found: warn
          retention-days: 14
